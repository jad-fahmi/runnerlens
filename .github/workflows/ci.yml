name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest

  action-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          command: python -c "from pathlib import Path; Path('runnerlens-smoke.txt').write_text('ok')"
          output: runnerlens-action-receipt.json
      - name: Verify action receipt exists
        run: test -s runnerlens-action-receipt.json
      - name: Verify action runner metadata
        run: python -c "import json; assert json.load(open('runnerlens-action-receipt.json'))['runner']['provider'] == 'github-actions'"
      - name: Verify action dependencies
        run: python -c "import json; assert json.load(open('runnerlens-action-receipt.json'))['dependencies']"
      - name: Verify Linux process-tree evidence
        run: python -c "import json; receipt = json.load(open('runnerlens-action-receipt.json')); assert any(event['observation'] == 'strace-execve' for event in receipt['events'])"
      - name: Verify wrapped command completed
        run: test "$(cat runnerlens-smoke.txt)" = "ok"
      - name: Accept the first receipt as a baseline
        run: cp runnerlens-action-receipt.json runnerlens-accepted-baseline.json
      - name: Check an unchanged build against the baseline
        uses: ./
        with:
          command: python -c "from pathlib import Path; Path('runnerlens-baseline-smoke.txt').write_text('ok')"
          output: runnerlens-baseline-check-receipt.json
          baseline: runnerlens-accepted-baseline.json
      - name: Verify baseline-check command completed
        run: test "$(cat runnerlens-baseline-smoke.txt)" = "ok"
      - name: Create a workflow-provisioned tool
        run: |
          mkdir -p /tmp/runnerlens-workflow-tools
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/runnerlens-workflow-tools/provisioned-tool
          chmod +x /tmp/runnerlens-workflow-tools/provisioned-tool
      - name: Observe a workflow-provisioned tool
        uses: ./
        with:
          command: /tmp/runnerlens-workflow-tools/provisioned-tool
          output: runnerlens-workflow-provisioned-receipt.json
          workflow-provisioned-paths: /tmp/runnerlens-workflow-tools
      - name: Verify workflow-provisioned classification
        run: python -c "import json; receipt = json.load(open('runnerlens-workflow-provisioned-receipt.json')); assert any(item['origin'] == 'workflow-provisioned' for item in receipt['dependencies'])"
      - name: Run a failing command through RunnerLens
        uses: ./
        continue-on-error: true
        with:
          command: python -c "raise SystemExit(7)"
          output: runnerlens-failed-command-receipt.json
      - name: Verify failed-command receipt
        run: python -c "import json; assert json.load(open('runnerlens-failed-command-receipt.json'))['exit_code'] == 7"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Verify installed wheel CLI
        run: |
          python -m venv install-test
          install-test/bin/python -m pip install --no-deps wheelhouse/*.whl
          install-test/bin/runnerlens version
