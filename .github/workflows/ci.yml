name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest

  action-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          command: |
            python -c "from pathlib import Path; Path('runnerlens-smoke.txt').write_text('ok')" &
            wait
          output: runnerlens-action-receipt.json
      - name: Verify action receipt exists
        run: test -s runnerlens-action-receipt.json
      - name: Verify action runner metadata
        run: python -c "import json; assert json.load(open('runnerlens-action-receipt.json'))['runner']['provider'] == 'github-actions'"
      - name: Verify action dependencies
        run: python -c "import json; dependencies = json.load(open('runnerlens-action-receipt.json'))['dependencies']; assert dependencies; assert any(item['name'] == 'python' for item in dependencies); assert not any(item['name'] == 'bash' for item in dependencies)"
      - name: Verify Linux process-tree evidence
        run: python -c "import json; receipt = json.load(open('runnerlens-action-receipt.json')); assert any(event['observation'] == 'strace-execve' for event in receipt['events']); assert any(event.get('parent_pid') is not None for event in receipt['events'])"
      - name: Verify wrapped command completed
        run: test "$(cat runnerlens-smoke.txt)" = "ok"
      - name: Accept the first receipt as a baseline
        run: cp runnerlens-action-receipt.json runnerlens-accepted-baseline.json
      - name: Check an unchanged build against the baseline
        uses: ./
        with:
          command: python -c "from pathlib import Path; Path('runnerlens-baseline-smoke.txt').write_text('ok')"
          output: runnerlens-baseline-check-receipt.json
          baseline: runnerlens-accepted-baseline.json
      - name: Verify baseline-check command completed
        run: test "$(cat runnerlens-baseline-smoke.txt)" = "ok"
      - name: Create a workflow-provisioned tool
        run: |
          mkdir -p /tmp/runnerlens-workflow-tools
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/runnerlens-workflow-tools/provisioned-tool
          chmod +x /tmp/runnerlens-workflow-tools/provisioned-tool
      - name: Observe a workflow-provisioned tool
        uses: ./
        with:
          command: /tmp/runnerlens-workflow-tools/provisioned-tool
          output: runnerlens-workflow-provisioned-receipt.json
          workflow-provisioned-paths: /tmp/runnerlens-workflow-tools
      - name: Verify workflow-provisioned classification
        run: python -c "import json; receipt = json.load(open('runnerlens-workflow-provisioned-receipt.json')); assert any(item['origin'] == 'workflow-provisioned' for item in receipt['dependencies'])"
      - name: Run a failing command through RunnerLens
        uses: ./
        continue-on-error: true
        with:
          command: python -c "raise SystemExit(7)"
          output: runnerlens-failed-command-receipt.json
      - name: Verify failed-command receipt
        run: python -c "import json; assert json.load(open('runnerlens-failed-command-receipt.json'))['exit_code'] == 7"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Verify installed wheel CLI
        run: |
          python -m venv install-test
          install-test/bin/python -m pip install --no-deps wheelhouse/*.whl
          install-test/bin/runnerlens version

  runner-image-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Compare a real pinned Ubuntu runner-image update
        run: |
          runnerlens impact tests/fixtures/receipts/ubuntu24-cargo.json \
            --baseline-image-version 20260831.293.1 \
            --target-image-version 20260907.300.1 > runner-image-impact.txt
          grep -F "changed              cargo" runner-image-impact.txt
      - name: Read a retained legacy Ubuntu runner-image inventory
        run: |
          runnerlens impact tests/fixtures/receipts/ubuntu22-cmake.json \
            --target-image-version 20220515.1 > legacy-runner-image-impact.txt
          grep -F "images/linux/Ubuntu2204-Readme.md" legacy-runner-image-impact.txt

  public-repository-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch a pinned public CMake project
        run: |
          git clone --no-checkout https://github.com/fmtlib/fmt.git fmt-fixture
          git -C fmt-fixture checkout 40626af88bd7df9a5fb80be7b25ac85b122d6c21
      - uses: ./
        with:
          command: |
            cmake -S fmt-fixture -B fmt-build -G Ninja
            cmake --build fmt-build
          output: public-fmt-receipt.json
      - name: Verify observed runner dependencies
        run: >-
          python -c "import json; dependencies = json.load(open('public-fmt-receipt.json'))['dependencies']; names = {item['name']: item for item in dependencies}; assert names['cmake']['origin'] == 'runner-provided'; assert names['ninja']['origin'] == 'runner-provided'; assert any(name in names for name in ('c++', 'g++', 'gcc', 'clang++', 'clang'))"
      - uses: actions/upload-artifact@v4
        with:
          name: public-fmt-receipt
          path: public-fmt-receipt.json

  public-rust-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch a pinned public Rust project
        run: |
          git clone --no-checkout https://github.com/BurntSushi/ripgrep.git ripgrep-fixture
          git -C ripgrep-fixture checkout 0e8390a66fbcf6eeac1aeb0541b367663a597c79
      - uses: ./
        with:
          command: cargo build --locked --manifest-path ripgrep-fixture/Cargo.toml
          output: public-ripgrep-receipt.json
      - name: Verify observed runner dependency
        run: >-
          python -c "import json; dependencies = json.load(open('public-ripgrep-receipt.json'))['dependencies']; cargo = next(item for item in dependencies if item['name'] == 'cargo'); assert cargo['origin'] == 'runner-provided'; assert cargo['version']"
      - uses: actions/upload-artifact@v4
        with:
          name: public-ripgrep-receipt
          path: public-ripgrep-receipt.json

  public-go-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch a pinned public Go project
        run: |
          git clone --no-checkout https://github.com/google/uuid.git go-uuid-fixture
          git -C go-uuid-fixture checkout 0f11ee6918f41a04c201eceeadf612a377bc7fbc
      - uses: ./
        with:
          command: |
            cd go-uuid-fixture
            go test ./...
          output: public-go-uuid-receipt.json
      - name: Verify observed runner dependency
        run: >-
          python -c "import json; dependencies = json.load(open('public-go-uuid-receipt.json'))['dependencies']; go = next(item for item in dependencies if item['name'] == 'go'); assert go['origin'] == 'tool-cache'; assert go['version']"
      - name: Diagnose Go receipt on failure
        if: failure()
        run: >-
          python -c "import json; dependencies = json.load(open('public-go-uuid-receipt.json'))['dependencies']; go = next((item for item in dependencies if item['name'] == 'go'), None); print(f'::error title=RunnerLens Go receipt::{go}')"
      - uses: actions/upload-artifact@v4
        with:
          name: public-go-uuid-receipt
          path: public-go-uuid-receipt.json
