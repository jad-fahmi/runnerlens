name: RunnerLens
description: Record the tools a build inherits from a GitHub-hosted Ubuntu runner.
branding:
  icon: search
  color: blue
inputs:
  command:
    description: Build or test command to observe.
    required: true
  output:
    description: Path for the Runner Dependency Receipt JSON file.
    required: false
    default: runnerlens-receipt.json
runs:
  using: composite
  steps:
    - name: Install RunnerLens
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Observe build command
      shell: bash
      env:
        RUNNERLENS_COMMAND: ${{ inputs.command }}
        RUNNERLENS_OUTPUT: ${{ inputs.output }}
      run: |
        set +e
        runnerlens run --output "$RUNNERLENS_OUTPUT" -- bash -o pipefail -c "$RUNNERLENS_COMMAND"
        exit_code=$?
        runnerlens show "$RUNNERLENS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        exit "$exit_code"
