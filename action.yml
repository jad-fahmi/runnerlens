name: RunnerLens
description: Record the tools a build inherits from a GitHub-hosted Ubuntu runner.
branding:
  icon: search
  color: blue
inputs:
  command:
    description: Build or test command to observe.
    required: true
  output:
    description: Path for the Runner Dependency Receipt JSON file.
    required: false
    default: runnerlens-receipt.json
  baseline:
    description: Optional accepted receipt to check for newly introduced ambient dependencies.
    required: false
    default: ""
  workflow-provisioned-paths:
    description: Optional colon-separated paths installed or configured by earlier workflow steps.
    required: false
    default: ""
  container:
    description: Set to true only when the wrapped command runs inside a workflow container.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install RunnerLens
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Observe build command
      shell: bash
      env:
        RUNNERLENS_COMMAND: ${{ inputs.command }}
        RUNNERLENS_OUTPUT: ${{ inputs.output }}
        RUNNERLENS_BASELINE: ${{ inputs.baseline }}
        RUNNERLENS_WORKFLOW_PROVISIONED_PATHS: ${{ inputs.workflow-provisioned-paths }}
        RUNNERLENS_CONTAINERIZED: ${{ inputs.container }}
      run: |
        set +e
        runnerlens run --output "$RUNNERLENS_OUTPUT" -- bash -o pipefail -c "$RUNNERLENS_COMMAND"
        exit_code=$?
        runnerlens show "$RUNNERLENS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$RUNNERLENS_BASELINE" ]; then
          runnerlens check "$RUNNERLENS_BASELINE" "$RUNNERLENS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          baseline_exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            exit_code=$baseline_exit_code
          fi
        fi
        exit "$exit_code"
